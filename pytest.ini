[pytest]
# pytest configuration for BedrockOnLinux GUI tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    gui: GUI integration tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_display: Tests requiring X11/Wayland display

# Qt/PySide6 specific configuration
qt_api = pyside6
qt_no_opengl = true

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Minimum Python version
minversion = 7.0

# Timeout for tests (seconds)
timeout = 30

# Coverage options (if pytest-cov is installed)
# --cov=bol --cov-report=html --cov-report=term-missing

testpaths = tests
