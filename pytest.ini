[pytest]
# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Markers, so --strict-markers below can reject typos rather than silently
# running the test unmarked.
markers =
    gui: GUI integration tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_display: Tests requiring X11/Wayland display

# Only options pytest itself provides: an unknown key here is a warning on
# every single run, not an error, so it survives indefinitely. qt_api and
# qt_no_opengl belong to pytest-qt and timeout to pytest-timeout, neither of
# which this suite installs -- the GUI tests drive QApplication directly.
addopts =
    --tb=short
    --strict-markers
    -ra

# Minimum pytest version (not Python).
minversion = 7.0
